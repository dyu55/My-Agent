[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "myagent"
version = "1.0.0"
description = "A local coding agent with durable runs, explicit tool permissions, and verified outcomes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "rich>=13,<15", "defusedxml>=0.7,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pytest>=8,<10"]

[project.optional-dependencies]
dev = ["pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
myagent = "myagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
