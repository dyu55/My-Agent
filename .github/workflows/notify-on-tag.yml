name: Notify on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create tag announcement
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const body = `## 🏷️ New Tag\n\n**Tag:** ${tag}\n**Commit:** ${context.sha.substring(0, 8)}\n\n[View Tag](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag})`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Tag: ${tag}`,
              body: body,
              labels: ['tag'],
            });
