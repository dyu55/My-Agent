name: Merge Strategy

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  label-merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add merge strategy labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;
            const labels = [];

            // Detect change type from title
            if (title.startsWith('feat')) labels.push('feature');
            else if (title.startsWith('fix')) labels.push('bugfix');
            else if (title.startsWith('docs')) labels.push('documentation');
            else if (title.startsWith('refactor')) labels.push('refactor');
            else if (title.startsWith('test')) labels.push('testing');
            else if (title.startsWith('ci')) labels.push('ci');
            else if (title.startsWith('chore')) labels.push('chore');

            if (labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: labels,
                });
              } catch (e) {
                console.log('Could not add labels:', e.message);
              }
            }
