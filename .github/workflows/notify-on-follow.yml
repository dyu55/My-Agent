name: Notify on Follow

on:
  watch:
    types: [started]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Log follow event
        uses: actions/github-script@v7
        with:
          script: |
            const user = context.payload.sender;
            console.log(`User followed: ${user.login}`);
            console.log(`Profile: ${user.html_url}`);
