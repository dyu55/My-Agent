name: Notify on Discussion

on:
  discussion:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
    steps:
      - name: Welcome discussion
        uses: actions/github-script@v7
        with:
          script: |
            const discussion = context.payload.discussion;

            console.log(`New discussion: ${discussion.title}`);
            console.log(`Author: ${discussion.user.login}`);
            console.log(`URL: ${discussion.html_url}`);
