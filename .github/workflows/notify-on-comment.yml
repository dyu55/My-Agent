name: Notify on Comment

on:
  issue_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-respond to common questions
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment;
            const body = comment.body.toLowerCase();

            // Auto-respond to common patterns
            if (body.includes('help') || body.includes('how to')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `👋 Thanks for reaching out! Please check our [documentation](https://github.com/${context.repo.owner}/${context.repo.repo}#readme) and [CONTRIBUTING.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/master/CONTRIBUTING.md) for guidance.`,
              });
            }
