name: CI Status

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Report CI status
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion;
            const icon = conclusion === 'success' ? '✅' : '❌';
            const body = `${icon} **CI ${conclusion}**\n\n**Workflow:** ${run.name}\n**Run:** #${run.run_number}\n**Branch:** ${run.head_branch}\n**Commit:** ${run.head_sha.substring(0, 8)}\n\n[View run](${run.html_url})`;

            // Create status comment on the commit
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: run.head_sha,
                body: body,
              });
            } catch (e) {
              console.log('Could not create commit comment:', e.message);
            }
