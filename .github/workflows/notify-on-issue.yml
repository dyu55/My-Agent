name: Notify on Issue

on:
  issues:
    types: [opened, labeled]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-label based on content
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = (issue.body || '').toLowerCase();
            const title = issue.title.toLowerCase();
            const labels = [];

            // Detect issue type
            if (title.includes('bug') || body.includes('error') || body.includes('crash')) {
              labels.push('bug');
            } else if (title.includes('feature') || body.includes('would like') || body.includes('suggestion')) {
              labels.push('enhancement');
            } else if (title.includes('doc') || body.includes('documentation')) {
              labels.push('documentation');
            }

            // Detect priority
            if (title.includes('urgent') || title.includes('critical') || body.includes('blocking')) {
              labels.push('priority: high');
            }

            if (labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: labels,
                });
              } catch (e) {
                console.log('Could not add labels:', e.message);
              }
            }
