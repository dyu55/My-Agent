name: Notify on Check

on:
  check_run:
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.check_run.conclusion == 'failure' }}
    steps:
      - name: Log failed check
        uses: actions/github-script@v7
        with:
          script: |
            const check = context.payload.check_run;
            console.log(`Check failed: ${check.name}`);
            console.log(`Conclusion: ${check.conclusion}`);
            console.log(`Details: ${check.html_url}`);
