name: Notify on Project

on:
  project_card:
    types: [created, moved]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Log project event
        uses: actions/github-script@v7
        with:
          script: |
            const card = context.payload.project_card;
            const action = context.payload.action;

            console.log(`Project card ${action}: ${card.note || card.content_url}`);
            console.log(`Column: ${card.column_id}`);
