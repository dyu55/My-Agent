name: Lock Threads

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: -1
          days-before-close: -1
          days-before-issue-lock: 30
          days-before-pr-lock: 7
          lock-issue-message: "This issue has been automatically locked due to inactivity."
          lock-pr-message: "This pull request has been automatically locked due to inactivity."
