name: PR Template Check

on:
  pull_request:
    types: [opened]

jobs:
  check-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            // Skip dependabot
            if (pr.user.login === 'dependabot[bot]') return;

            const checks = {
              hasDescription: body.length > 50,
              hasType: /bug|feature|fix|docs|refactor/i.test(body),
              hasTesting: /test|pytest|coverage/i.test(body),
            };

            const warnings = [];
            if (!checks.hasDescription) warnings.push('Please add a meaningful description');
            if (!checks.hasType) warnings.push('Please describe the type of change');
            if (!checks.hasTesting) warnings.push('Please describe how you tested the changes');

            if (warnings.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `## PR Checklist\n\n${warnings.map(w => `- ⚠️ ${w}`).join('\n')}\n\nPlease update your PR description to include these items.`,
              });
            }
