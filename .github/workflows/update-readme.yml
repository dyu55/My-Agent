name: Update README Badge

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  update-badge:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update CI badge
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readmePath = 'README.md';

            if (!fs.existsSync(readmePath)) return;

            let content = fs.readFileSync(readmePath, 'utf8');
            const run = context.payload.workflow_run;
            const status = run ? run.conclusion : 'unknown';
            const badge = status === 'success' ? '✅' : '❌';
            const date = new Date().toISOString().split('T')[0];

            // Update or add status line
            const statusRegex = /\*\*CI Status:\*\*.*$/m;
            const newStatus = `**CI Status:** ${badge} ${status} (${date})`;

            if (statusRegex.test(content)) {
              content = content.replace(statusRegex, newStatus);
            } else {
              // Add after first heading
              content = content.replace(/^(# .+\n)/, `$1\n${newStatus}\n`);
            }

            fs.writeFileSync(readmePath, content);
