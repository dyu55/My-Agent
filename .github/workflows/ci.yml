name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run pytest --cov=myagent --cov-report=term-missing --cov-fail-under=85
      - run: uv run python -m build
      - name: Install and exercise the wheel outside the source tree
        run: |
          uv venv "$RUNNER_TEMP/installed" --python ${{ matrix.python }}
          uv pip install --python "$RUNNER_TEMP/installed/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed/bin/myagent" demo --workspace "$RUNNER_TEMP/myagent-demo" --json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t myagent:test .
      - run: docker run --rm myagent:test demo --workspace /tmp/demo --json
