name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to MyAgent! Thanks for opening your first issue. We'll take a look soon."
          pr-message: "Welcome to MyAgent! Thanks for your first PR. We appreciate your contribution!"
