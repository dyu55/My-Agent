name: Notify on Fork

on:
  fork:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Welcome fork
        uses: actions/github-script@v7
        with:
          script: |
            const fork = context.payload.forkee;

            console.log(`Repository forked by ${fork.owner.login}`);
            console.log(`Fork URL: ${fork.html_url}`);
