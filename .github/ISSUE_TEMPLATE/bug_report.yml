name: Bug Report
description: Report a bug or issue
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run `python main.py "task"`
        2. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: MyAgent version
      placeholder: "0.2.0"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Model Provider
      options:
        - Ollama
        - OpenAI
        - Anthropic
        - DeepSeek
        - Gemini
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      description: Model name
      placeholder: "qwen3.5:9b"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "macOS 14.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "3.12.0"
    validations:
      required: true
